name: Build iOS IPA

# 方案 2.B：GitHub Actions macOS runner 构建未签名 IPA，配合 Sideloadly 自签
# 触发方式：手动 / 推送 v* tag
# 配套安装方案 3.A：Sideloadly + 免费 Apple ID（7天）或 Apple Developer 证书（1年）

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: '版本名 (如 5.0.0-beta)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.41.1'

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore server_config.dart from secret
        env:
          SERVER_CONFIG: ${{ secrets.SERVER_CONFIG }}
        run: |
          if [ -z "$SERVER_CONFIG" ]; then
            echo "::error::Secret SERVER_CONFIG 未配置。请到 Settings → Secrets and variables → Actions 添加，内容为 lib/config/server_config.dart 的完整源码。"
            exit 1
          fi
          mkdir -p lib/config
          printf '%s\n' "$SERVER_CONFIG" > lib/config/server_config.dart
          echo "已恢复 lib/config/server_config.dart"
          # 不打印内容，避免泄露服务器地址
          echo "文件行数：$(wc -l < lib/config/server_config.dart)"

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify analysis (info only, 0 errors required)
        run: flutter analyze
        continue-on-error: true

      - name: Build iOS IPA (unsigned)
        run: |
          # --no-codesign: 不签名，配合 Sideloadly 本地自签
          # 输出：build/ios/ipa/*.ipa
          flutter build ipa --no-codesign --release

      - name: List build artifacts
        run: |
          ls -lh build/ios/ipa/ || true
          echo "---"
          find build/ios/ipa -name "*.ipa" -exec echo "IPA: {}" \;

      - name: Get version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "name=$TAG" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.build_name }}" ]; then
            echo "tag=custom" >> $GITHUB_OUTPUT
            echo "name=${{ github.event.inputs.build_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=manual" >> $GITHUB_OUTPUT
            echo "name=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
          fi

      - name: Rename IPA to huixiang-{version}.ipa
        run: |
          cd build/ios/ipa
          SRC=$(ls *.ipa | head -n1)
          DST="huixiang-${{ steps.version.outputs.name }}.ipa"
          if [ -n "$SRC" ] && [ "$SRC" != "$DST" ]; then
            mv "$SRC" "$DST"
          fi
          echo "重命名为: $DST"
          ls -lh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: huixiang-ios-${{ steps.version.outputs.tag }}
          path: build/ios/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          echo "## iOS 构建完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 版本：${{ steps.version.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- 签名：未签名（用于 Sideloadly 自签）" >> $GITHUB_STEP_SUMMARY
          echo "- 产物：在 Artifacts 下载 \`huixiang-ios-${{ steps.version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 下一步：Sideloadly 自签安装" >> $GITHUB_STEP_SUMMARY
          echo "1. 下载 IPA 到 Windows" >> $GITHUB_STEP_SUMMARY
          echo "2. 用 Sideloadly + Apple ID 签名安装到 iPhone" >> $GITHUB_STEP_SUMMARY
          echo "3. iPhone 设置 → 通用 → VPN与设备管理 → 信任开发者" >> $GITHUB_STEP_SUMMARY
